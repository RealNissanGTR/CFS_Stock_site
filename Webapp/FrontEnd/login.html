<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CFS Stock</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="page-shell">
        <section class="hero">
        <header>
            <div>
                <h1>CFS Stock Management</h1>
                <p class="badge">Workshop + Paddock inventory tracking</p>
            </div>
        </header>
            <h2>Sign in</h2>
            <p>Access the stock management area for Workshop and Paddock.</p>

            {% if error %}
            <div class="card" style="margin-bottom: 1rem; border-left: 4px solid #fb7185;">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}

            <form class="form-grid" method="post" action="/login">
                <label>
                    Username
                    <input type="text" name="username" required>
                </label>
                <label>
                    Password
                    <input type="password" name="password" required>
                </label>
                <button type="submit">Login</button>
            </form>
        </section>
    </main>
</body>
</html>
